name: NYC Room Hunter

on:
  schedule:
    # Runs every 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: python scraper.py --email

      - name: Commit updated seen_listings.json
        run: |
          git config user.name "room-hunter-bot"
          git config user.email "actions@github.com"
          git add seen_listings.json latest_report.md
          git diff --cached --quiet || git commit -m "chore: update seen listings $(date -u '+%Y-%m-%d %H:%M')"
          git push
