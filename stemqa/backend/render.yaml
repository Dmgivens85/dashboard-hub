services:
  - type: web
    name: stemqa-backend
    runtime: python
    plan: free
    rootDir: stemqa/backend
    buildCommand: pip install -r requirements.txt && python -m demucs --help
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /openapi.json
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: STEMQA_ALLOWED_ORIGINS
        value: https://dmgivens85.github.io,http://127.0.0.1:4173,http://localhost:4173
